<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ふたりで行きたい</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7fb;
      color: #222;
    }
    .app {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 16px 96px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 24px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab {
      border: none;
      padding: 10px 14px;
      border-radius: 999px;
      background: #e5e7eb;
      cursor: pointer;
      font-size: 14px;
    }
    .tab.active {
      background: #111827;
      color: #fff;
    }
    .form-card, .card {
      background: #fff;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .form-card {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    input[type="url"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
    }
    .primary {
      background: #111827;
      color: white;
    }
    .secondary {
      background: #e5e7eb;
      color: #111827;
    }
    .list {
      display: grid;
      gap: 12px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
      word-break: break-word;
    }
    .card-domain {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 10px;
    }
    .card a {
      color: #2563eb;
      text-decoration: none;
      word-break: break-all;
      font-size: 13px;
      display: inline-block;
      margin-bottom: 12px;
    }
    .empty {
      text-align: center;
      color: #6b7280;
      padding: 32px 16px;
    }
    .floating-add {
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #111827;
      color: #fff;
      font-size: 28px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    }
    .hint {
      font-size: 12px;
      color: #6b7280;
      margin-top: -6px;
      margin-bottom: 12px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>ふたりで行きたい</h1>

    <div class="tabs">
      <button class="tab active" data-tab="want">行きたい</button>
      <button class="tab" data-tab="done">行った</button>
    </div>

    <section id="addForm" class="form-card hidden">
      <label for="urlInput">URL</label>
      <input id="urlInput" type="url" placeholder="お店やスポットのURLを貼り付け" />
      <div class="hint">URLからタイトルを自動補助入力します</div>
      <div class="actions">
        <button id="saveBtn" class="primary">保存</button>
        <button id="cancelBtn" class="secondary">閉じる</button>
      </div>
    </section>

    <section id="list" class="list"></section>
  </div>

  <button id="openFormBtn" class="floating-add" aria-label="追加">＋</button>

  <script>
    const STORAGE_KEY = 'date_spots_minimal_v1';

    let currentTab = 'want';
    let items = loadItems();

    const listEl = document.getElementById('list');
    const formEl = document.getElementById('addForm');
    const urlInput = document.getElementById('urlInput');
    const saveBtn = document.getElementById('saveBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const openFormBtn = document.getElementById('openFormBtn');
    const tabButtons = document.querySelectorAll('.tab');

    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        currentTab = btn.dataset.tab;
        tabButtons.forEach(b => b.classList.toggle('active', b === btn));
        render();
      });
    });

    openFormBtn.addEventListener('click', openForm);
    cancelBtn.addEventListener('click', closeForm);
    saveBtn.addEventListener('click', addItem);

    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addItem();
      }
    });

    function loadItems() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveItems() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function openForm() {
      formEl.classList.remove('hidden');
      urlInput.focus();
    }

    function closeForm() {
      formEl.classList.add('hidden');
      urlInput.value = '';
    }

    function normalizeUrl(value) {
      const trimmed = value.trim();
      if (!trimmed) return '';
      if (/^https?:\/\//i.test(trimmed)) return trimmed;
      return 'https://' + trimmed;
    }

    function getDomain(url) {
      try {
        return new URL(url).hostname.replace(/^www\./, '');
      } catch {
        return '';
      }
    }

    function guessTitleFromUrl(url) {
      try {
        const u = new URL(url);
        const lastPath = u.pathname.split('/').filter(Boolean).pop();
        if (lastPath) {
          return decodeURIComponent(lastPath)
            .replace(/[-_]/g, ' ')
            .replace(/\.[a-z0-9]+$/i, '')
            .trim();
        }
        return u.hostname.replace(/^www\./, '');
      } catch {
        return url;
      }
    }

    async function fetchTitle(url) {
      try {
        const proxyUrl = 'https://r.jina.ai/http://' + url.replace(/^https?:\/\//, '');
        const res = await fetch(proxyUrl);
        if (!res.ok) throw new Error('fetch failed');
        const text = await res.text();
        const titleMatch = text.match(/<title[^>]*>(.*?)<\/title>/i);
        if (titleMatch && titleMatch[1]) {
          return titleMatch[1].trim();
        }
      } catch {
        // no-op
      }
      return guessTitleFromUrl(url);
    }

    async function addItem() {
      const rawUrl = urlInput.value;
      const url = normalizeUrl(rawUrl);
      if (!url) return;

      try {
        new URL(url);
      } catch {
        alert('正しいURLを入力してください');
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = '保存中...';

      const title = await fetchTitle(url);
      const domain = getDomain(url);

      items.unshift({
        id: crypto.randomUUID(),
        url,
        title: title || domain || url,
        domain,
        visited: false,
        createdAt: Date.now()
      });

      saveItems();
      render();
      closeForm();

      saveBtn.disabled = false;
      saveBtn.textContent = '保存';
    }

    function toggleVisited(id) {
      items = items.map(item => item.id === id ? { ...item, visited: !item.visited } : item);
      saveItems();
      render();
    }

    function removeItem(id) {
      items = items.filter(item => item.id !== id);
      saveItems();
      render();
    }

    function render() {
      const filtered = items.filter(item => currentTab === 'want' ? !item.visited : item.visited);

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="empty">${currentTab === 'want' ? 'まだ行きたい場所がありません' : 'まだ行った場所がありません'}</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(item => `
        <article class="card">
          <div class="card-title">${escapeHtml(item.title)}</div>
          <div class="card-domain">${escapeHtml(item.domain || 'URL保存')}</div>
          <a href="${escapeAttr(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.url)}</a>
          <div class="actions">
            <button class="primary" onclick="toggleVisited('${item.id}')">${item.visited ? '行きたいに戻す' : '行った'}</button>
            <button class="secondary" onclick="removeItem('${item.id}')">削除</button>
          </div>
        </article>
      `).join('');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttr(str) {
      return escapeHtml(str);
    }

    window.toggleVisited = toggleVisited;
    window.removeItem = removeItem;

    render();
  </script>
</body>
</html>
